org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# This machine is memory-constrained for Android builds — run Kotlin
# compilation inside the Gradle daemon's own JVM instead of spawning a
# separate Kotlin daemon process (avoids RMI timeouts under memory pressure,
# at the cost of some parallelism). Safe to remove once more RAM is available.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
